image: node:20

stages:
  - quality
  - i18n
  - test
  - build

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .node/
    policy: pull-push
  before_script:
    - export NODE_VERSION="$(cat .nvmrc)"
    - export NODE_DIST="node-v${NODE_VERSION}-linux-x64"
    - export LOCAL_NODE_DIR="$CI_PROJECT_DIR/.node/${NODE_DIST}"
    - |
      if [ ! -x "$LOCAL_NODE_DIR/bin/node" ]; then
        mkdir -p "$CI_PROJECT_DIR/.node"
        NODE_ARCHIVE="$CI_PROJECT_DIR/.node/${NODE_DIST}.tar.xz"
        NODE_URL="https://nodejs.org/dist/v${NODE_VERSION}/${NODE_DIST}.tar.xz"

        if command -v curl >/dev/null 2>&1; then
          curl -fsSL "$NODE_URL" -o "$NODE_ARCHIVE"
        elif command -v wget >/dev/null 2>&1; then
          wget -qO "$NODE_ARCHIVE" "$NODE_URL"
        else
          echo "Neither curl nor wget is available on the runner. Cannot download Node ${NODE_VERSION}."
          exit 1
        fi

        if ! command -v tar >/dev/null 2>&1; then
          echo "tar is not available on the runner. Cannot extract Node ${NODE_VERSION}."
          exit 1
        fi

        tar -xJf "$NODE_ARCHIVE" -C "$CI_PROJECT_DIR/.node"
        rm -f "$NODE_ARCHIVE"
      fi
    - export PATH="$LOCAL_NODE_DIR/bin:$PATH"
    - which node
    - node -v
    - npm -v
    - rm -rf node_modules
    - npm ci --cache .npm --prefer-offline

variables:
  CI: 'true'
  GIT_CLEAN_FLAGS: none
  NPM_CONFIG_CACHE: '.npm'

quality_checks:
  stage: quality
  script:
    - export NODE_OPTIONS="--import tsx"
    - npm run format:check
    - npm run lint
    - npm run typecheck
    - npm run knip

i18n_validation:
  stage: i18n
  script:
    - npm run validate:i18n
    - npm run i18n:replace

test_cases:
  stage: test
  script:
    - npm test

test_coverage:
  stage: test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  script:
    - npm run test:coverage
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
