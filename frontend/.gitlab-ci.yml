image: node:20

stages:
  - quality
  - i18n
  - test
  - build

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  CI: 'true'
  NPM_CONFIG_CACHE: '.npm'

quality_checks:
  stage: quality
  script:
    - npm run format:check
    # Generate GitLab Code Quality report, don't fail yet
    - npm run lint -- -f gitlab -o gl-codequality.json || true
    # Run lint again so standard output is visible in logs, fails pipeline if there are errors
    - npm run lint
    - npm run typecheck
    - npm run knip
  artifacts:
    reports:
      codequality: gl-codequality.json
    expire_in: 7 days

i18n_validation:
  stage: i18n
  script:
    - npm run validate:i18n
    - npm run i18n:replace

test_cases:
  stage: test
  script:
    - npm test

test_coverage:
  stage: test
  # Matches vitest text reporter output
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  script:
    - npm run test:coverage
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
